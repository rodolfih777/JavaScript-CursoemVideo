<!DOCTYPE html>
<html lang=" pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
</head>
<style>
    div#area{
        font-size: normal 20pt arial;
        background-color: green;
        color: #ffffff;
        width: 200px;
        height: 200px;
        line-height: 200px;
        text-align: center;

    }
</style>
<body>
    <div id="area" onclick="clicar()">
             interaja
    </div>
    <script>
        function clicar(){
            var a = window.document.getElementById('area')
            a.innerText = 'clicou'
        }

        function sair (){
            var s = window.document.getElementById('area')

            s.innerText=('saiu')
        }

    </script>
</body>
</html>
